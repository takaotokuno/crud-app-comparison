name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-test-migration-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aspnetcore-nextjs/backend/AspNetNextApp.Api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ../AspNetNextApp.sln

      - name: Check dotnet format
        working-directory: aspnetcore-nextjs/backend
        run: dotnet format AspNetNextApp.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aspnetcore-nextjs/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: aspnetcore-nextjs/frontend
        run: npm ci

      - name: Check frontend format
        working-directory: aspnetcore-nextjs/frontend
        run: npm run format:check

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Check pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --no-build