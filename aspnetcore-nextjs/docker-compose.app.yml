services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aspnet-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AppDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=False;"
      Database__ApplyMigrations: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aspnetcore-nextjs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://backend:8080
    container_name: next-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - aspnetcore-nextjs

networks:
  aspnetcore-nextjs:
    external: true
    name: aspnetcore-nextjs
